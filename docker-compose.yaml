services:
  postgres:
    image: postgres:15
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: evolution_redis
    restart: always
    ports:
      - "6379:6379"

  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - postgres
      - redis
      - webhook-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances

  webhook-api:
    build:
      context: ./webhook-api
      dockerfile: Dockerfile
    container_name: evolution_webhook_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./webhook-api/.env
    volumes:
      - ./webhook-api/logs:/app/logs

volumes:
  evolution_instances:
  evolution_postgres_data: